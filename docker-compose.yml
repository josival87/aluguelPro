services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      METER_OCR_URL: http://ocr:8000
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
      METER_OCR_URL: http://ocr:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
      METER_OCR_URL: http://ocr:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ocr:
    build:
      context: ./ocr
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-alugapro}
      POSTGRES_USER: ${DB_USERNAME:-alugapro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-alugapro} -d ${DB_DATABASE:-alugapro}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
